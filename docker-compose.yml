services:
  xray-geocheck:
    image: ghcr.io/l0nelynx/xray-geocheck:latest
    pull_policy: always
    container_name: xray-geocheck
    ports:
#      - "8080:8080"
      - "3113:3113"
    cap_add:
      - NET_RAW
    env_file:
      - .env
    volumes:
      - geocheck-data:/data
    restart: unless-stopped

volumes:
  geocheck-data:
